name: CI
on:
  push:
    branches: [ main ]
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        ruby:
          - '3.0'
          - '3.1'
          - '3.2'
          - '3.3'
          - '3.4'
        os:
          - 'ubuntu-latest'
          - 'windows-latest'
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: ${{ matrix.ruby }}
        bundler-cache: true
    # Build the native extension from a clean checkout before testing, so a
    # native build regression fails CI on its own (rake test also compiles,
    # but an explicit step surfaces build failures distinctly).
    - name: Compile extension
      run: bundle exec rake compile
    - name: Tests
      run: bundle exec rake test
    - name: RuboCop
      run: bundle exec rake lint

  # Memory-safety validation for the tenant-filter rewrite path (Task 09),
  # in two tiers. The qualify/filter C code allocates and rewrites AST nodes,
  # so a leak or invalid access is easy to introduce and hard to catch with
  # correctness tests alone.

  # Tier 1 (BLOCKING): a Ruby-free C harness that calls the rewrite API
  # directly across every shape from Tasks 01-07 (including refusal and
  # non-strict bypass paths). With no interpreter in the process there is
  # essentially no Valgrind noise, so --error-exitcode=1 is a trustworthy gate
  # and no suppression file is needed.
  memcheck-c:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Install Valgrind
      run: sudo apt-get update && sudo apt-get install -y valgrind
    - name: Run C-harness memcheck
      run: bin/run_memcheck.sh

  # Tier 2 (INFORMATIONAL): the full qualify spec under Valgrind, exercising the
  # binding across the Ruby boundary. CRuby's conservative GC holds process-
  # lifetime allocations and scans the stack, so Valgrind reports thousands of
  # leaks/errors that all originate in the `ruby` binary, not pg_query. We
  # suppress the bulk via .valgrind-ruby.supp, but this job is NOT expected to
  # exit zero and is marked continue-on-error: it surfaces a binding-level leak
  # if one appears (grep the log for pg_query frames), without red-walling CI.
  memcheck-ruby:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Install Valgrind
      run: sudo apt-get update && sudo apt-get install -y valgrind
    - name: Compile extension
      run: bundle exec rake compile
    - name: Run qualify spec under Valgrind (informational)
      run: |
        valgrind \
          --leak-check=full \
          --errors-for-leak-kinds=definite \
          --trace-children=yes \
          --suppressions=.valgrind-ruby.supp \
          --gen-suppressions=all \
          bundle exec rspec spec/lib/qualify_spec.rb
